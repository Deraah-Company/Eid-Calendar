<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أجندة الفعالية | Event Agenda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* اللون المأخوذ بدقة من لوجو درعه */
            --primary-color: #C81062; 
            --glass-bg: rgba(255, 255, 255, 0.08); 
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-white: #ffffff;
            --text-gold: #f2d588;
        }

        body {
            font-family: 'Tajawal', 'Poppins', sans-serif;
            color: var(--accent-white);
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1a0f14;
            /* خلفية متوازنة - ليست داكنة جداً وليست فاتحة جداً */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(200, 16, 98, 0.2), transparent 50%),
                radial-gradient(circle at 85% 20%, rgba(200, 16, 98, 0.15), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(200, 16, 98, 0.1), transparent 50%);
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        @media (min-width: 768px) {
            .glass { border-radius: 24px; }
        }

        .card-3d {
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-3d:hover {
            transform: translateY(-5px) rotateX(2deg) rotateY(2deg);
            border-color: var(--primary-color);
            box-shadow: 0 15px 30px rgba(200, 16, 98, 0.3), inset 0 0 0 1px rgba(200, 16, 98, 0.5);
            background: rgba(255, 255, 255, 0.12);
        }

        @media (min-width: 768px) {
            .card-3d:hover {
                transform: translateY(-10px) rotateX(4deg) rotateY(4deg);
                box-shadow: 0 20px 40px rgba(200, 16, 98, 0.3), inset 0 0 0 1px rgba(200, 16, 98, 0.5);
            }
        }

        .btn-control {
            padding: 8px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-white);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        @media (min-width: 768px) {
            .btn-control { padding: 10px 15px; }
        }

        .btn-control:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }

        .slide-enter {
            animation: slideUp 0.8s forwards ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes flipSpin {
            0% { transform: perspective(600px) rotateY(0); }
            50% { transform: perspective(600px) rotateY(90deg) scale(1.1); }
            100% { transform: perspective(600px) rotateY(0); }
        }

        .flip-anim {
            animation: flipSpin 0.6s ease-in-out;
        }

        .time-text { color: var(--text-gold); font-weight: 700; text-shadow: 0 0 15px rgba(242, 213, 136, 0.4); }
        .title-text { color: var(--accent-white); text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .subtitle-text { color: rgba(255,255,255,0.7); }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 15px var(--primary-color);
        }

        .fullscreen-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 6px;
            z-index: 100;
        }

        @media (min-width: 768px) {
            .fullscreen-overlay { top: 20px; right: 20px; gap: 10px; }
        }

        .active-day-btn {
            background: var(--primary-color) !important;
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 15px rgba(200, 16, 98, 0.6);
        }

        /* Logos Responsiveness */
        .main-logos {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .main-logos img { height: 35px; width: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .footer-logos {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        .footer-logos img { height: 40px; width: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        @media (min-width: 768px) {
            .main-logos { top: 20px; left: 20px; gap: 15px; }
            .main-logos img { height: 50px; }
            .footer-logos { bottom: 30px; left: 30px; gap: 20px; }
            .footer-logos img { height: 60px; }
        }

        .hidden-on-home { display: none !important; }

        /* Grid specific for Summary */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr; /* 1 column on mobile */
            gap: 1rem;
            width: 100%;
            max-height: 60vh;
            overflow-y: auto; /* scrollable on mobile */
            padding-right: 5px;
        }

        @media (min-width: 768px) {
            .summary-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 columns on desktop */
                gap: 1.5rem;
                max-height: 70vh; 
            }
        }
        
        .summary-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            .summary-item {
                border-radius: 16px;
                padding: 1rem 1.5rem;
                gap: 1rem;
            }
        }
        
        .summary-item:hover {
            background: rgba(200, 16, 98, 0.15);
            border-color: var(--primary-color);
            transform: translateX(-5px);
        }

        /* Custom Scrollbar for Summary */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }

    </style>
</head>
<body onclick="handleGlobalClick(event)">

    <!-- Main Logos (Home Screen) -->
    <div class="main-logos" id="mainLogos">
        <img src="Deraah2.png" alt="Deraah Logo" onerror="this.src='https://via.placeholder.com/120x40/C81062/FFF?text=Deraah'">
        <img src="D.png" alt="D Logo" onerror="this.src='https://via.placeholder.com/40x40/C81062/FFF?text=D'">
    </div>

    <!-- Controls -->
    <div class="fullscreen-overlay">
        <button class="btn-control" onclick="goHome()" title="الرئيسية">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="hidden md:inline">الرئيسية</span>
        </button>
        <button class="btn-control" id="playBtn" onclick="toggleAutoPlay(event)" title="عرض تلقائي">
            <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span id="playText" class="hidden md:inline">عرض تلقائي</span>
        </button>
        <button class="btn-control" onclick="toggleSummary(event)" title="الكل">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span class="hidden md:inline">الكل</span>
        </button>
        <button class="btn-control" onclick="toggleFullScreen(event)" title="ملء الشاشة">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            <span class="hidden md:inline">ملء الشاشة</span>
        </button>
    </div>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center p-4 md:p-6 relative w-full h-full">
        
        <!-- Dynamic Number Circle with Progress Ring (Left Side) - Hidden on Mobile to save space -->
        <div id="numberCircleContainer" class="hidden-on-home absolute left-12 top-1/2 transform -translate-y-1/2 z-50 flex-col items-center hidden lg:flex">
            <div class="relative w-28 h-28 flex items-center justify-center">
                <!-- SVG Progress Ring -->
                <svg class="absolute inset-0 w-full h-full transform -rotate-90 drop-shadow-[0_0_15px_rgba(200,16,98,0.5)]" viewBox="0 0 100 100">
                    <!-- Track -->
                    <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="6" />
                    <!-- Progress (dynamically updated) -->
                    <circle id="progressCircle" cx="50" cy="50" r="46" fill="none" stroke="var(--primary-color)" stroke-width="6" stroke-dasharray="289" stroke-dashoffset="289" stroke-linecap="round" class="transition-all duration-700 ease-in-out" />
                </svg>
                <!-- Inner Number -->
                <div id="numberCircle" class="w-20 h-20 rounded-full bg-black/50 backdrop-blur-md flex items-center justify-center z-10 relative">
                    <span id="currentEventNumber" class="text-4xl font-bold text-[var(--primary-color)]">1</span>
                </div>
            </div>
            <span class="text-white/50 text-xs mt-3 font-bold tracking-widest uppercase">الفقرة</span>
        </div>

        <!-- Home Screen (Single Card) -->
        <div id="homeScreen" class="flex flex-col items-center justify-center w-full max-w-2xl slide-enter z-10" style="display: flex;">
            <div class="glass card-3d p-8 md:p-14 text-center w-full" onclick="startPresentation()">
                <div class="w-12 md:w-20 h-1 bg-[var(--primary-color)] mx-auto mb-6 md:mb-8 rounded-full"></div>
                <h2 class="text-4xl md:text-6xl font-bold mb-3 md:mb-4 title-text">أجندة الفعالية</h2>
                <p class="text-xl md:text-3xl mb-8 md:mb-12 text-white font-bold" style="color: var(--text-gold);">الثلاثاء، 5 مايو 2026</p>
                <div class="inline-flex items-center justify-center gap-3 md:gap-4 px-6 py-3 md:px-10 md:py-4 rounded-full bg-[var(--primary-color)] text-white text-lg md:text-xl font-bold hover:bg-white hover:text-[var(--primary-color)] transition-all">
                    ابدأ العرض <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rotate-180 md:w-6 md:h-6"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                </div>
            </div>
        </div>

        <!-- Presentation Slide -->
        <div id="presentationScreen" class="w-full max-w-5xl slide-enter z-10" style="display: none;">
            <div class="glass p-8 md:p-16 text-center relative overflow-hidden">
                <div class="progress-bar" id="progressBar"></div>
                <div id="slideContent" class="py-8 md:py-12">
                    <!-- إطار فخم للوقت -->
                    <div class="inline-block px-4 py-2 md:px-8 md:py-4 rounded-2xl md:rounded-3xl border border-[rgba(200,16,98,0.3)] bg-[rgba(200,16,98,0.1)] mb-6 md:mb-8 shadow-[0_0_20px_rgba(200,16,98,0.15)]">
                        <h3 id="slideTime" class="time-text text-2xl md:text-5xl font-mono tracking-widest m-0" dir="ltr"></h3>
                    </div>
                    <h1 id="slideTitleAr" class="title-text text-4xl md:text-7xl font-bold mb-4 md:mb-6 leading-tight"></h1>
                    <h2 id="slideTitleEn" class="text-xl md:text-3xl subtitle-text italic font-light tracking-wide"></h2>
                </div>
            </div>
        </div>

        <!-- Summary Screen -->
        <div id="summaryScreen" class="w-full max-w-7xl slide-enter z-10 flex-col items-center justify-center h-full" style="display: none;">
            <div class="glass p-6 md:p-10 w-full rounded-[20px] md:rounded-[30px] flex flex-col items-center max-h-full">
                <div class="text-center mb-6 md:mb-8 shrink-0">
                    <h2 class="text-3xl md:text-4xl font-bold mb-2 title-text" id="summaryTitle">أجندة الفعالية</h2>
                    <div class="w-16 md:w-24 h-1 bg-[var(--primary-color)] mx-auto mt-3 md:mt-4 mb-2 rounded-full"></div>
                    <p class="text-lg md:text-xl font-bold text-[var(--text-gold)]" id="summaryDate"></p>
                </div>
                
                <div id="summaryList" class="summary-grid w-full">
                    <!-- Items populated by JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Logos (Other Screens) -->
    <div class="footer-logos hidden-on-home" id="footerLogos">
        <img src="Deraah2.png" alt="Deraah Logo" onerror="this.src='https://via.placeholder.com/120x40/C81062/FFF?text=Deraah'">
        <img src="D.png" alt="D Logo" onerror="this.src='https://via.placeholder.com/40x40/C81062/FFF?text=D'">
    </div>

    <script>
        const agendaDate = "الثلاثاء، 5 مايو 2026";
        const agendaItems = [
            { time: "08:00 AM - 09:00 AM", ar: "الإفطار والتسجيل", en: "Breakfast & Registration" },
            { time: "09:00 AM - 09:30 AM", ar: "تسليم جوائز السيارات", en: "Car Awards Ceremony" },
            { time: "09:30 AM - 12:30 PM", ar: "استعراض قطاع العمليات", en: "Operations Department Review" },
            { time: "12:30 PM - 01:00 PM", ar: "استراحة قهوة وصلاة", en: "Coffee Break & Prayer" },
            { time: "01:00 PM - 02:00 PM", ar: "استعراض إدارة التسويق", en: "Marketing Department Review" },
            { time: "02:00 PM - 03:00 PM", ar: "استعراض إدارة تجربة العميل", en: "Customer Experience Review" },
            { time: "03:00 PM - 03:30 PM", ar: "استراحة قهوة وصلاة", en: "Coffee Break & Prayer" },
            { time: "03:30 PM - 04:30 PM", ar: "استعراض إدارة المنتجات", en: "Product Management Review" },
            { time: "04:30 PM - 05:00 PM", ar: "إدارة التدريب والختام", en: "Training Dept. & Closing" },
            { time: "05:00 PM - 06:00 PM", ar: "نهاية اليوم والغداء", en: "Lunch & End of Day" }
        ];

        let currentIndex = 0;
        let autoPlayInterval = null;
        let isAutoPlaying = false;
        const AUTO_PLAY_SPEED = 5000;

        function toggleLogosAndCircle(isHome, isSummary = false) {
            const mainLogos = document.getElementById('mainLogos');
            const footerLogos = document.getElementById('footerLogos');
            const numberCircle = document.getElementById('numberCircleContainer');
            
            if (isHome) {
                mainLogos.classList.remove('hidden-on-home');
                footerLogos.classList.add('hidden-on-home');
                numberCircle.classList.add('hidden-on-home');
            } else {
                mainLogos.classList.add('hidden-on-home');
                footerLogos.classList.remove('hidden-on-home');
                
                if (isSummary) {
                    numberCircle.classList.add('hidden-on-home');
                } else {
                    numberCircle.classList.remove('hidden-on-home');
                }
            }
        }

        function startPresentation() {
            currentIndex = 0;
            showScreen('presentationScreen');
            updateSlide();
            toggleLogosAndCircle(false);
        }

        function updateSlide() {
            if (currentIndex >= agendaItems.length) {
                stopAutoPlay();
                showSummary();
                return;
            }

            const item = agendaItems[currentIndex];
            const content = document.getElementById('slideContent');
            const circle = document.getElementById('numberCircle');
            const progressCircle = document.getElementById('progressCircle');

            // حساب نسبة الدائرة
            const circumference = 289; 
            const progressPercent = (currentIndex + 1) / agendaItems.length;
            const dashoffset = circumference - (progressPercent * circumference);
            progressCircle.style.strokeDashoffset = dashoffset;

            // Animate Number Circle
            circle.classList.remove('flip-anim');
            void circle.offsetWidth;
            circle.classList.add('flip-anim');
            
            setTimeout(() => {
                document.getElementById('currentEventNumber').innerText = currentIndex + 1;
            }, 300);

            // Animate text
            content.classList.remove('slide-enter');
            void content.offsetWidth;
            content.classList.add('slide-enter');

            document.getElementById('slideTime').innerText = item.time;
            document.getElementById('slideTitleAr').innerText = item.ar;
            document.getElementById('slideTitleEn').innerText = item.en;

            if (isAutoPlaying) {
                resetProgressBar();
            }
        }

        function nextSlide() {
            currentIndex++;
            updateSlide();
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlide();
            }
        }

        function goHome() {
            stopAutoPlay();
            showScreen('homeScreen');
            toggleLogosAndCircle(true);
        }

        function toggleSummary(e) {
            e.stopPropagation();
            stopAutoPlay();
            showSummary();
        }

        function showSummary() {
            const list = document.getElementById('summaryList');
            document.getElementById('summaryDate').innerText = agendaDate;
            
            // Responsive text sizes added inside the JS template map
            list.innerHTML = agendaItems.map((item, idx) => `
                <div class="summary-item">
                    <div class="text-[var(--primary-color)] text-lg md:text-xl font-bold opacity-50 shrink-0 w-5 md:w-6">
                        ${String(idx + 1).padStart(2, '0')}
                    </div>
                    <div class="flex-grow">
                        <div class="text-base md:text-lg font-bold text-white leading-tight">${item.ar}</div>
                        <div class="text-[10px] md:text-xs text-white/50 mt-1">${item.en}</div>
                    </div>
                    <div class="time-text text-sm md:text-base font-mono shrink-0" dir="ltr">${item.time}</div>
                </div>
            `).join('');

            showScreen('summaryScreen');
            toggleLogosAndCircle(false, true);
        }

        function showScreen(screenId) {
            const screens = ['homeScreen', 'presentationScreen', 'summaryScreen'];
            screens.forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
            
            const active = document.getElementById(screenId);
            if (screenId === 'homeScreen') active.style.display = 'flex';
            else if (screenId === 'summaryScreen') active.style.display = 'flex';
            else active.style.display = 'block';
        }

        function handleGlobalClick(e) {
            if (e.target.closest('.btn-control') || e.target.closest('.card-3d') || e.target.closest('.main-logos')) return;
            
            const summary = document.getElementById('summaryScreen');
            if (summary.style.display !== 'none') {
                goHome();
                return;
            }

            const pres = document.getElementById('presentationScreen');
            if (pres.style.display !== 'none') {
                nextSlide();
            }
        }

        document.addEventListener('keydown', (e) => {
            const pres = document.getElementById('presentationScreen');
            if (pres.style.display !== 'none') {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') nextSlide();
                if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
            }
            
            const summary = document.getElementById('summaryScreen');
            if (summary.style.display !== 'none' && e.key === 'Escape') {
                goHome();
            }
        });

        function toggleAutoPlay(e) {
            e.stopPropagation();
            if (isAutoPlaying) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        }

        function startAutoPlay() {
            isAutoPlaying = true;
            document.getElementById('playText').innerText = "إيقاف";
            document.getElementById('playBtn').classList.add('active-day-btn');
            document.getElementById('playIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
            
            resetProgressBar();
            autoPlayInterval = setInterval(() => {
                nextSlide();
            }, AUTO_PLAY_SPEED);
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            clearInterval(autoPlayInterval);
            document.getElementById('playText').innerText = "عرض تلقائي";
            document.getElementById('playBtn').classList.remove('active-day-btn');
            document.getElementById('playIcon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
            document.getElementById('progressBar').style.width = '0%';
        }

        function resetProgressBar() {
            const bar = document.getElementById('progressBar');
            bar.style.transition = 'none';
            bar.style.width = '0%';
            setTimeout(() => {
                bar.style.transition = `width ${AUTO_PLAY_SPEED}ms linear`;
                bar.style.width = '100%';
            }, 50);
        }

        function toggleFullScreen(e) {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Initialize
        toggleLogosAndCircle(true);

    </script>
</body>
</html>
